<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    
    <!-- THE FUTURISTIC FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- THE PARTICLE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            background-color: #0b071a;
            overflow: hidden; /* Prevents scrollbars */
            height: 100vh; /* Forces the body to be exactly the screen height */
        }

        /* UTILITY CLASS TO HIDE ELEMENTS */
        .hidden {
            display: none !important;
        }

        /* PAGE WRAPPER (Used for both Homepage and Navigation Room) */
        .page-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 15px;
        }

        /* THE HOMEPAGE BACKGROUND LAYER */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/5ywKpzvD/Screenshot-20260929-094937-Google.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            background-color: rgba(11, 7, 26, 0.4);
            background-blend-mode: overlay;
        }

        /* THE TRUE CLEAR BUBBLE STYLE */
        .glass-panel {
            background: transparent; 
            backdrop-filter: blur(2px); 
            -webkit-backdrop-filter: blur(2px);
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
            position: relative;
            overflow: hidden; 
        }

        /* THE FUTURISTIC HEADER TEXT */
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #06b6d4 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.6)) drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
            text-align: center;
            padding: 0 10px;
        }

        /* HEADER HEIGHT */
        header { height: 100px; width: 100%; padding: 0 20px; }

        /* NAVIGATION (NOW CLICKABLE) */
        nav { 
            height: 50px; 
            width: 100%; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        nav:hover {
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.6);
            border-color: rgba(217, 70, 239, 0.8);
        }

        /* 3 COLUMN CONTENT AREA (HOMEPAGE) */
        main {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            width: 100%;
            flex: 1; /* THIS FIXES THE SHRINKING: It forces the main area to expand */
        }

        .content-box { 
            width: 100%; 
            height: 100%; 
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* The circular profile images */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(217, 70, 239, 0.8);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
            z-index: 2;
        }

        /* FOOTER */
        footer { height: 60px; width: 100%; }

        /* --- NAVIGATION ROOM (DASHBOARD LAYOUT) --- */
        #navigation-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('https://i.postimg.cc/Dy6xxLm9/Screenshot-20260930-133327-Google.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
            background-color: rgba(11, 7, 26, 0.5);
            background-blend-mode: overlay;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Navigation inside Nav Room */
        .nav-room-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(217, 70, 239, 0.5);
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.3);
        }

        .nav-room-top button {
            background: transparent;
            border: 1px solid rgba(217, 70, 239, 0.6);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.2);
            transition: all 0.3s ease;
        }
        .nav-room-top button:hover {
            background: rgba(217, 70, 239, 0.3);
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.6);
        }

        /* Main Dashboard Grid */
        .nav-room-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 15px;
            width: 100%;
            flex: 1;
        }

        /* Left Column: Profile */
        .nav-col-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 40px;
            box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid #d946ef;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.5);
        }

        .stat-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            font-size: 12px;
        }

        /* Center Column: Dashboard */
        .nav-col-center {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 40px;
            box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        }

        .chart-box {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            position: relative;
        }

        .chart-line {
            width: 80%;
            height: 50%;
            border-bottom: 3px solid #d946ef;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 15px 20px -10px rgba(217, 70, 239, 0.8);
        }

        .data-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .data-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        /* Right Column: Activity */
        .nav-col-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 40px;
            box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        }

        .activity-item {
            background: rgba(255,255,255,0.05);
            border-left: 4px solid #06b6d4;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-box { min-height: 200px; }
            header h1 { font-size: 16px; letter-spacing: 1px; }
            
            /* Stack Nav Room Layout on Mobile */
            .nav-room-grid { grid-template-columns: 1fr; }
            .nav-room-top { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav-col-left, .nav-col-center, .nav-col-right { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HOMEPAGE WRAPPER -->
    <!-- ========================================== -->
    <div id="homepage" class="page-container">
        
        <!-- THE IMAGE LAYER -->
        <div class="bg-image"></div>

        <!-- THE LIVE PARTICLE LAYER -->
        <div id="tsparticles-home" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

        <!-- HEADER -->
        <header class="glass-panel">
            <h1>Welcome Now let's get down to business</h1>
        </header>

        <!-- NAVIGATION MENU (CLICKABLE) -->
        <nav class="glass-panel" onclick="goToNavRoom()">Navigation Menu</nav>

        <main>
            <!-- LEFT BOX: EINSTEIN -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/q68vzNnY/einstein-profile-jpg.jpg" alt="Einstein" class="profile-img">
                <span>Einstein</span>
            </div>

            <!-- CENTER BOX: BUZZ -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/gnFwmW8W/buzz-profile-jpg.jpg" alt="Buzz" class="profile-img">
                <span>Buzz</span>
            </div>

            <!-- RIGHT BOX: GOD MODE -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/Th9wMDdK/libray-backgrond.jpg" alt="Library Background" class="profile-img">
                <span>God mode</span>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="glass-panel">Library</footer>
    </div>

    <!-- ========================================== -->
    <!-- NAVIGATION ROOM (DASHBOARD) -->
    <!-- ========================================== -->
    <div id="navigation-room" class="hidden">
        
        <!-- THE LIVE PARTICLE LAYER FOR THE NAV ROOM -->
        <div id="tsparticles-nav" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; z-index: 1; position: relative;">
            
            <!-- TOP NAV BAR IN ROOM -->
            <div class="nav-room-top glass-panel">
                <button>🏠 Home</button>
                <button>📊 Insights</button>
                <button>⚡ Activity</button>
                <button>👤 Profile</button>
            </div>

            <!-- MAIN DASHBOARD GRID -->
            <div class="nav-room-grid">
                
                <!-- LEFT: PROFILE -->
                <div class="nav-col-left glass-panel">
                    <div class="avatar-circle">
                        <span style="font-size: 30px;">👤</span>
                    </div>
                    <div style="font-family: 'Orbitron', sans-serif; text-align: center;">
                        <div>Alex R.</div>
                        <div style="font-size: 12px; color: #d946ef;">4.9 Stars</div>
                    </div>
                    
                    <div class="stat-row">
                        <div class="stat-box"><div>17</div><div>Avatar</div></div>
                        <div class="stat-box"><div>11</div><div>Stats</div></div>
                        <div class="stat-box"><div>16</div><div>Followers</div></div>
                    </div>
                </div>

                <!-- CENTER: DASHBOARD -->
                <div class="nav-col-center glass-panel">
                    <div style="font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 10px;">Dashboard</div>
                    
                    <div class="chart-box">
                        <div class="chart-line"></div>
                    </div>

                    <div class="data-row">
                        <div class="data-box">
                            <div style="font-size: 20px; font-weight: bold; color: #d946ef;">48%</div>
                            <div style="font-size: 10px;">Active data</div>
                        </div>
                        <div class="data-box">
                            <div style="font-size: 20px; font-weight: bold; color: #06b6d4;">21.4k</div>
                            <div style="font-size: 10px;">Report data</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: center;">
                        <button style="background: transparent; border: 1px solid rgba(217, 70, 239, 0.6); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px;">⚙️ Settings</button>
                        <button style="background: transparent; border: 1px solid rgba(217, 70, 239, 0.6); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px;">📈 Analytics</button>
                        <button style="background: transparent; border: 1px solid rgba(217, 70, 239, 0.6); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px;">📄 Reports</button>
                    </div>
                </div>

                <!-- RIGHT: ACTIVITY -->
                <div class="nav-col-right glass-panel">
                    <div style="font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 10px;">Recent Activity</div>
                    
                    <div class="activity-item">
                        <div style="font-weight: bold;">Recent lied</div>
                        <div style="color: #aaa; font-size: 10px;">Revised from 2h ago</div>
                    </div>
                    <div class="activity-item">
                        <div style="font-weight: bold;">Recent two</div>
                        <div style="color: #aaa; font-size: 10px;">Cancelled our meeting</div>
                    </div>
                    <div class="activity-item">
                        <div style="font-weight: bold;">Recent Alert</div>
                        <div style="color: #aaa; font-size: 10px;">Look in 18 mins ago</div>
                    </div>
                </div>

            </div>

            <!-- BACK BUTTON -->
            <button class="glass-panel" style="margin-top: 15px; padding: 15px 30px; cursor: pointer; color: white; font-family: 'Orbitron', sans-serif; background: transparent;" onclick="goHome()">
                ← Back to Home
            </button>

        </div>
    </div>

    <!-- THE PARTICLE SCRIPT -->
    <script>
        // --- NAVIGATION LOGIC ---
        function goToNavRoom() {
            document.getElementById('homepage').classList.add('hidden');
            document.getElementById('navigation-room').classList.remove('hidden');
        }

        function goHome() {
            document.getElementById('homepage').classList.remove('hidden');
            document.getElementById('navigation-room').classList.add('hidden');
        }

        // --- PARTICLE EFFECT FUNCTION ---
        function loadParticles(containerId) {
            tsParticles.load(containerId, {
                background: { color: { value: "transparent" } }, 
                fpsLimit: 60,
                particles: {
                    color: { value: ["#d946ef", "#06b6d4", "#ffffff"] }, 
                    links: {
                        color: "#d946ef",
                        distance: 150,
                        enable: true,
                        opacity: 0.15, 
                        width: 1
                    },
                    move: {
                        direction: "none",
                        enable: true,
                        outModes: { default: "bounce" },
                        random: true,
                        speed: 0.8, 
                        straight: false
                    },
                    number: {
                        density: { enable: true, area: 800 },
                        value: 50
                    },
                    opacity: { value: 0.4 },
                    shape: { type: "circle" },
                    size: { value: { min: 1, max: 3 } }
                },
                detectRetina: true
            });
        }

        // Load particles for both rooms
        loadParticles("tsparticles-home");
        loadParticles("tsparticles-nav");
    </script>

</body>
</html>
