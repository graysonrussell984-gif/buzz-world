<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    
    <!-- THE FUTURISTIC FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- THE PARTICLE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
            background-color: #0b071a;
            overflow-x: hidden;
        }

        /* THE BACKGROUND IMAGE LAYER */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* YOUR NEW BACKGROUND LINK IS RIGHT HERE */
            background-image: url('https://i.postimg.cc/50VTF1Xt/pngtree-abstract-technology-background-with-pink-and-blue-waves-lights-picture-image-15713085.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            background-color: rgba(11, 7, 26, 0.5);
            background-blend-mode: overlay;
        }

        /* THE TRUE CLEAR BUBBLE STYLE */
        .glass-panel {
            background: transparent; 
            backdrop-filter: blur(2px); 
            -webkit-backdrop-filter: blur(2px);
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
            position: relative;
            overflow: hidden; 
        }

        /* THE FUTURISTIC HEADER TEXT */
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #06b6d4 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.6)) drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
            text-align: center;
            padding: 0 10px;
        }

        /* HEADER HEIGHT */
        header { height: 100px; width: 100%; padding: 0 20px; }

        /* --- NEW NAVIGATION MENU STYLE --- */
        nav { 
            height: auto; 
            width: 100%; 
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(20, 10, 40, 0.7);
            border: 2px solid #d946ef;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: rgba(217, 70, 239, 0.3);
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }

        /* 3 COLUMN CONTENT AREA */
        main {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            width: 100%;
            flex: 1;
        }

        .content-box { 
            width: 100%; 
            height: 100%; 
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* The circular profile images */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(217, 70, 239, 0.8);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
            z-index: 2;
        }

        /* FOOTER */
        footer { height: 60px; width: 100%; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-box { min-height: 200px; }
            header h1 { font-size: 16px; letter-spacing: 1px; }
            .nav-btn { font-size: 12px; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- THE IMAGE LAYER -->
    <div class="bg-image"></div>

    <!-- THE LIVE PARTICLE LAYER -->
    <div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

    <!-- HEADER -->
    <header class="glass-panel">
        <h1>Welcome Now let's get down to business</h1>
    </header>

    <!-- NAVIGATION MENU (CLICKABLE) -->
    <nav class="glass-panel">
        <button class="nav-btn" onclick="navigateTo('Home')">🏠 Home</button>
        <button class="nav-btn" onclick="navigateTo('Insights')">📊 Insights</button>
        <button class="nav-btn" onclick="navigateTo('Activity')">⚡ Activity</button>
        <button class="nav-btn" onclick="navigateTo('Profile')">👤 Profile</button>
    </nav>

    <main>
        <!-- LEFT BOX: EINSTEIN -->
        <div class="glass-panel content-box" onclick="navigateTo('Einstein')">
            <img src="https://i.postimg.cc/q68vzNnY/einstein-profile-jpg.jpg" alt="Einstein" class="profile-img">
            <span>Einstein</span>
        </div>

        <!-- CENTER BOX: BUZZ (Main Content Placeholder) -->
        <div class="glass-panel content-box" id="main-content-box">
            <img src="https://i.postimg.cc/gnFwmW8W/buzz-profile-jpg.jpg" alt="Buzz" class="profile-img">
            <span>Buzz</span>
        </div>

        <!-- RIGHT BOX: GOD MODE -->
        <div class="glass-panel content-box" onclick="navigateTo('God mode')">
            <img src="https://i.postimg.cc/Th9wMDdK/libray-backgrond.jpg" alt="Library Background" class="profile-img">
            <span>God mode</span>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-panel">Library</footer>

    <!-- THE PARTICLE SCRIPT -->
    <script>
        // --- NAVIGATION LOGIC ---
        function navigateTo(page) {
            const mainBox = document.getElementById('main-content-box');
            // For now, we just swap the text in the center box to show it works.
            // Later, we will replace this with a proper page transition.
            mainBox.innerHTML = `
                <h2 style="font-family: 'Orbitron', sans-serif; color: #d946ef; margin-bottom: 10px;">Room: ${page}</h2>
                <p style="font-size: 14px; color: #ccc;">This room is under construction.</p>
            `;
        }

        // --- PARTICLE EFFECT ---
        tsParticles.load("tsparticles", {
            background: { color: { value: "transparent" } }, 
            fpsLimit: 60,
            particles: {
                color: { value: ["#d946ef", "#06b6d4", "#ffffff"] }, 
                links: {
                    color: "#d946ef",
                    distance: 150,
                    enable: true,
                    opacity: 0.15, 
                    width: 1
                },
                move: {
                    direction: "none",
                    enable: true,
                    outModes: { default: "bounce" },
                    random: true,
                    speed: 0.8, 
                    straight: false
                },
                number: {
                    density: { enable: true, area: 800 },
                    value: 50
                },
                opacity: { value: 0.4 },
                shape: { type: "circle" },
                size: { value: { min: 1, max: 3 } }
            },
            detectRetina: true
        });
    </script>

</body>
</html>
