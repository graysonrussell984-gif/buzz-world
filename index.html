<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    
    <!-- THE PARTICLE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
            background-color: #0b071a; /* Fallback color */
            overflow-x: hidden;
        }

        /* THE BACKGROUND IMAGE LAYER */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* YOUR IMAGE IS RIGHT HERE */
            background-image: url('https://i.postimg.cc/5ywKpzvD/Screenshot-20260929-094937-Google.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            background-color: rgba(11, 7, 26, 0.4);
            background-blend-mode: overlay;
        }

        /* THE TRUE GLASS BOX STYLE */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
            position: relative;
        }

        /* HEADER */
        header { height: 80px; width: 100%; }

        /* NAVIGATION */
        nav { height: 50px; width: 100%; }

        /* 3 COLUMN CONTENT AREA */
        main {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            width: 100%;
            flex: 1;
        }

        .content-box { width: 100%; height: 100%; }

        /* FOOTER */
        footer { height: 60px; width: 100%; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-box { min-height: 150px; }
        }
    </style>
</head>
<body>

    <!-- THE IMAGE LAYER -->
    <div class="bg-image"></div>

    <!-- THE LIVE PARTICLE LAYER -->
    <div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

    <header class="glass-panel">Header</header>
    <nav class="glass-panel">Navigation Menu</nav>

    <main>
        <div class="glass-panel content-box">Content</div>
        <div class="glass-panel content-box">Main Content</div>
        <div class="glass-panel content-box">Content</div>
    </main>

    <footer class="glass-panel">Footer</footer>

    <!-- THE PARTICLE SCRIPT -->
    <script>
        tsParticles.load("tsparticles", {
            background: { color: { value: "transparent" } }, // Transparent so the image shows
            fpsLimit: 60,
            particles: {
                color: { value: ["#d946ef", "#06b6d4", "#ffffff"] }, // Pink, Blue, White
                links: {
                    color: "#d946ef",
                    distance: 150,
                    enable: true,
                    opacity: 0.15, 
                    width: 1
                },
                move: {
                    direction: "none",
                    enable: true,
                    outModes: { default: "bounce" },
                    random: true,
                    speed: 0.8, 
                    straight: false
                },
                number: {
                    density: { enable: true, area: 800 },
                    value: 50
                },
                opacity: { value: 0.4 },
                shape: { type: "circle" },
                size: { value: { min: 1, max: 3 } }
            },
            detectRetina: true
        });
    </script>

</body>
</html>
