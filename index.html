<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    
    <!-- THE FUTURISTIC FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- THE PARTICLE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            background-color: #0b071a;
            overflow: hidden; /* Prevents scrollbars */
            height: 100vh; /* Forces the body to be exactly the screen height */
        }

        /* UTILITY CLASS TO HIDE ELEMENTS */
        .hidden {
            display: none !important;
        }

        /* PAGE WRAPPER (Used for both Homepage and Navigation Room) */
        .page-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 15px;
        }

        /* THE HOMEPAGE BACKGROUND LAYER */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/5ywKpzvD/Screenshot-20260929-094937-Google.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            background-color: rgba(11, 7, 26, 0.4);
            background-blend-mode: overlay;
        }

        /* THE TRUE CLEAR BUBBLE STYLE */
        .glass-panel {
            background: transparent; 
            backdrop-filter: blur(2px); 
            -webkit-backdrop-filter: blur(2px);
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
            position: relative;
            overflow: hidden; 
        }

        /* THE FUTURISTIC HEADER TEXT */
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #06b6d4 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.6)) drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
            text-align: center;
            padding: 0 10px;
        }

        /* HEADER HEIGHT */
        header { height: 100px; width: 100%; padding: 0 20px; }

        /* NAVIGATION (NOW CLICKABLE) */
        nav { 
            height: 50px; 
            width: 100%; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        nav:hover {
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.6);
            border-color: rgba(217, 70, 239, 0.8);
        }

        /* 3 COLUMN CONTENT AREA */
        main {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            width: 100%;
            flex: 1; /* THIS FIXES THE SHRINKING: It forces the main area to expand */
        }

        .content-box { 
            width: 100%; 
            height: 100%; 
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* The circular profile images */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(217, 70, 239, 0.8);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
            z-index: 2;
        }

        /* FOOTER */
        footer { height: 60px; width: 100%; }

        /* --- NEW NAVIGATION ROOM STYLES --- */
        #navigation-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            /* YOUR NEW BACKGROUND IMAGE IS RIGHT HERE */
            background-image: url('https://i.postimg.cc/Dy6xxLm9/Screenshot-20260930-133327-Google.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
            /* THE DARK OVERLAY TO MATCH THE HOMEPAGE VIBE */
            background-color: rgba(11, 7, 26, 0.5);
            background-blend-mode: overlay;
        }

        #navigation-room h1 {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            text-shadow: 0 0 15px #d946ef, 0 0 30px #06b6d4;
            margin-bottom: 20px;
            text-align: center;
        }

        #navigation-room p {
            color: #ccc;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-box { min-height: 200px; }
            header h1 { font-size: 16px; letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HOMEPAGE WRAPPER -->
    <!-- ========================================== -->
    <div id="homepage" class="page-container">
        
        <!-- THE IMAGE LAYER -->
        <div class="bg-image"></div>

        <!-- THE LIVE PARTICLE LAYER -->
        <div id="tsparticles-home" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

        <!-- HEADER -->
        <header class="glass-panel">
            <h1>Welcome Now let's get down to business</h1>
        </header>

        <!-- NAVIGATION MENU (CLICKABLE) -->
        <nav class="glass-panel" onclick="goToNavRoom()">Navigation Menu</nav>

        <main>
            <!-- LEFT BOX: EINSTEIN -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/q68vzNnY/einstein-profile-jpg.jpg" alt="Einstein" class="profile-img">
                <span>Einstein</span>
            </div>

            <!-- CENTER BOX: BUZZ -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/gnFwmW8W/buzz-profile-jpg.jpg" alt="Buzz" class="profile-img">
                <span>Buzz</span>
            </div>

            <!-- RIGHT BOX: GOD MODE -->
            <div class="glass-panel content-box">
                <img src="https://i.postimg.cc/Th9wMDdK/libray-backgrond.jpg" alt="Library Background" class="profile-img">
                <span>God mode</span>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="glass-panel">Library</footer>
    </div>

    <!-- ========================================== -->
    <!-- NEW NAVIGATION ROOM -->
    <!-- ========================================== -->
    <div id="navigation-room" class="hidden page-container">
        
        <!-- THE LIVE PARTICLE LAYER FOR THE NAV ROOM -->
        <div id="tsparticles-nav" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

        <!-- NAV ROOM CONTENT -->
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; z-index: 1;">
            <h1>Navigation Room</h1>
            <p>This is the new room. We can build whatever you want in here. The background is the new image you sent.</p>
            <button class="glass-panel" style="padding: 15px 30px; cursor: pointer; color: white; font-family: 'Orbitron', sans-serif; background: transparent;" onclick="goHome()">
                ← Back to Home
            </button>
        </div>
    </div>

    <!-- THE PARTICLE SCRIPT -->
    <script>
        // --- NAVIGATION LOGIC ---
        function goToNavRoom() {
            document.getElementById('homepage').classList.add('hidden');
            document.getElementById('navigation-room').classList.remove('hidden');
        }

        function goHome() {
            document.getElementById('homepage').classList.remove('hidden');
            document.getElementById('navigation-room').classList.add('hidden');
        }

        // --- PARTICLE EFFECT FUNCTION ---
        function loadParticles(containerId) {
            tsParticles.load(containerId, {
                background: { color: { value: "transparent" } }, 
                fpsLimit: 60,
                particles: {
                    color: { value: ["#d946ef", "#06b6d4", "#ffffff"] }, 
                    links: {
                        color: "#d946ef",
                        distance: 150,
                        enable: true,
                        opacity: 0.15, 
                        width: 1
                    },
                    move: {
                        direction: "none",
                        enable: true,
                        outModes: { default: "bounce" },
                        random: true,
                        speed: 0.8, 
                        straight: false
                    },
                    number: {
                        density: { enable: true, area: 800 },
                        value: 50
                    },
                    opacity: { value: 0.4 },
                    shape: { type: "circle" },
                    size: { value: { min: 1, max: 3 } }
                },
                detectRetina: true
            });
        }

        // Load particles for both rooms
        loadParticles("tsparticles-home");
        loadParticles("tsparticles-nav");
    </script>

</body>
</html>
