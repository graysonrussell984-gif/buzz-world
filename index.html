<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    
    <!-- THE PARTICLE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* BASE BACKGROUND COLOR */
            background-color: #0b071a;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
        }

        /* THE GLASS BOX STYLE FOR ALL PANELS */
        .glass-panel {
            background: rgba(11, 7, 26, 0.65); /* Deep dark purple, semi-transparent */
            backdrop-filter: blur(12px); /* The magic blur effect */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 70, 239, 0.3); /* Subtle pink border */
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1; /* Keeps panels above the particles */
        }

        /* HEADER */
        header {
            height: 80px;
            width: 100%;
        }

        /* NAVIGATION */
        nav {
            height: 50px;
            width: 100%;
            border-color: rgba(6, 182, 212, 0.4); /* Subtle blue border for nav */
        }

        /* 3 COLUMN CONTENT AREA */
        main {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr; /* Left 1 part, Middle 2 parts, Right 1 part */
            gap: 15px;
            width: 100%;
            flex: 1; /* This makes the main area grow to fill the screen */
        }

        .content-box {
            width: 100%;
            height: 100%; /* Fills the grid cell */
        }

        /* FOOTER */
        footer {
            height: 60px;
            width: 100%;
        }

        /* MOBILE RESPONSIVE (So it looks good on your phone too) */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr; /* Stack the 3 columns on top of each other on mobile */
            }
            .content-box {
                min-height: 150px; /* Give them height when stacked */
            }
        }
    </style>
</head>
<body>

    <!-- THE LIVE BACKGROUND LAYER -->
    <div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>

    <header class="glass-panel">
        Header
    </header>

    <nav class="glass-panel">
        Navigation Menu
    </nav>

    <main>
        <div class="glass-panel content-box">Content</div>
        <div class="glass-panel content-box">Main Content</div>
        <div class="glass-panel content-box">Content</div>
    </main>

    <footer class="glass-panel">
        Footer
    </footer>

    <!-- THE PARTICLE SCRIPT -->
    <script>
        tsParticles.load("tsparticles", {
            background: {
                color: {
                    value: "#0b071a"
                }
            },
            fpsLimit: 60,
            particles: {
                color: {
                    value: ["#d946ef", "#06b6d4", "#ffffff"]
                },
                links: {
                    color: "#d946ef",
                    distance: 150,
                    enable: true,
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    direction: "none",
                    enable: true,
                    outModes: {
                        default: "bounce"
                    },
                    random: true,
                    speed: 1,
                    straight: false
                },
                number: {
                    density: {
                        enable: true,
                        area: 800
                    },
                    value: 60
                },
                opacity: {
                    value: 0.5
                },
                shape: {
                    type: "circle"
                },
                size: {
                    value: { min: 1, max: 3 }
                }
            },
            detectRetina: true
        });
    </script>

</body>
</html>
